<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .main { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .ext { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .pwr { fill: none; stroke: #bc4c00; stroke-width: 2.5; }
    .sig { fill: none; stroke: #0969da; stroke-width: 2; }
    .t { fill: #1f2328; text-anchor: middle; }
    .b { font-weight: bold; font-size: 15px; }
    .s { font-size: 12px; fill: #57606a; }
    .lp { fill: #bc4c00; font-size: 12px; }
    .ls { fill: #0969da; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .main { fill: #0c2d6b; stroke: #4493f8; }
      .ext { fill: #0d1117; stroke: #6e7681; }
      .pwr { stroke: #f0883e; }
      .sig { stroke: #4493f8; }
      .t { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .lp { fill: #f0883e; }
      .ls { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="570" rx="12"/>

  <!-- outside world -->
  <rect class="ext" x="60" y="20" width="160" height="40" rx="6"/>
  <text class="t" x="140" y="45">PC</text>
  <rect class="ext" x="610" y="20" width="290" height="40" rx="6"/>
  <text class="t" x="755" y="45">USB 電源アダプタ / PC（開発・書き込み）</text>

  <!-- USB-C ports -->
  <rect class="box" x="70" y="96" width="140" height="54" rx="6"/>
  <text class="t b" x="140" y="118">Port A（USB-C）</text>
  <text class="t s" x="140" y="138">HID ＋ 給電</text>
  <rect class="box" x="740" y="96" width="160" height="54" rx="6"/>
  <text class="t b" x="820" y="118">Port B（USB-C）</text>
  <text class="t s" x="820" y="138">開発・rpiboot ＋ 給電</text>
  <path class="sig" d="M140 60 V96"/>
  <path class="sig" d="M820 60 V96"/>

  <!-- power path -->
  <rect class="box" x="340" y="170" width="200" height="56" rx="6"/>
  <text class="t b" x="440" y="194">TPS2121</text>
  <text class="t s" x="440" y="214">電源の切り替え（B 優先・5 µs）</text>
  <path class="pwr" d="M210 123 H280 V198 H340"/>
  <text class="lp" x="226" y="116">VBUS</text>
  <path class="pwr" d="M740 123 H600 V198 H540"/>
  <text class="lp" x="660" y="116">VBUS</text>
  <path class="pwr" d="M440 226 V290"/>
  <path class="pwr" d="M440 252 H210 V290"/>
  <text class="lp" x="448" y="270">5 V</text>

  <!-- controllers -->
  <rect class="main" x="40" y="290" width="200" height="110" rx="8"/>
  <text class="t b" x="140" y="330">RP2040</text>
  <text class="t s" x="140" y="352">USB HID・RGB</text>
  <text class="t s" x="140" y="370">電源の判断・CC の判定</text>
  <rect class="main" x="340" y="290" width="560" height="110" rx="8"/>
  <text class="t b" x="620" y="335">CM0（CM0Lite）</text>
  <text class="t s" x="620" y="357">Linux・UI</text>

  <path class="sig" d="M140 150 V290" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="ls" x="148" y="236">USB</text>
  <path class="sig" d="M820 150 V290" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="ls" x="828" y="236">USB（rpiboot）</text>

  <path class="sig" d="M240 320 H340" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="ls" x="290" y="312" text-anchor="middle">UART</text>
  <path class="sig" d="M240 370 H340" marker-end="url(#a)"/>
  <text class="ls" x="290" y="362" text-anchor="middle">I²C HID</text>
  <text class="ls" x="290" y="388" text-anchor="middle">（キー入力）</text>

  <!-- below RP2040 -->
  <rect class="box" x="40" y="470" width="200" height="70" rx="6"/>
  <text class="t b" x="140" y="495">キーマトリクス（42 キー）</text>
  <text class="t s" x="140" y="516">＋ キーごとの RGB</text>
  <path class="sig" d="M140 400 V470"/>

  <!-- below CM0 -->
  <rect class="box" x="340" y="470" width="128" height="70" rx="6"/>
  <text class="t b" x="404" y="495">8.8″ LCD</text>
  <text class="t s" x="404" y="516">480 × 1920・タッチ</text>
  <path class="sig" d="M404 400 V470"/>
  <text class="ls" x="412" y="440">DSI</text>

  <rect class="box" x="484" y="470" width="128" height="70" rx="6"/>
  <text class="t b" x="548" y="495">RTC</text>
  <text class="t s" x="548" y="516">PCF8563T ＋ CR2032</text>
  <path class="sig" d="M548 400 V470"/>
  <text class="ls" x="556" y="440">I²C</text>

  <rect class="box" x="628" y="470" width="128" height="70" rx="6"/>
  <text class="t b" x="692" y="495">コーデック</text>
  <text class="t s" x="692" y="515">TLV320DAC3100</text>
  <text class="t s" x="692" y="532">スピーカー・イヤホン</text>
  <path class="sig" d="M692 400 V470"/>
  <text class="ls" x="700" y="440">I²S</text>

  <rect class="box" x="772" y="470" width="128" height="70" rx="6"/>
  <text class="t b" x="836" y="495">microSD</text>
  <text class="t s" x="836" y="516">起動・保存</text>
  <path class="sig" d="M836 400 V470"/>
  <text class="ls" x="844" y="440">SD</text>
</svg>
