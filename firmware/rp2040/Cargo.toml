[package]
name = "skjar-rp2040"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
rmk = { version = "0.9.0", default-features = false, features = ["rp2040", "log"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-time = "0.5"
embassy-sync = "0.8"
embassy-futures = "0.1"
embedded-io-async = "0.7"
embassy-usb = "0.6"
embassy-usb-logger = "0.6"
log = "0.4"
cortex-m-rt = "0.7.5"
panic-halt = "1"
portable-atomic = { version = "1", features = ["critical-section"] }
static_cell = "2"

[features]
default = ["pico"]
# Raspberry Pi Pico で試す（キー入力の I²C は I2C1：GPIO26 SDA / GPIO27 SCL）
pico = []
# SKJÁR の基板（キー入力の I²C は I2C0：GPIO24 SDA / GPIO25 SCL）
skjar = []

[profile.dev]
opt-level = 1
debug = true

[profile.release]
codegen-units = 1
debug = true
opt-level = "s"
lto = "fat"
