# SKJÁR: let systemd feed the SoC's hardware watchdog, so a hung CM0 (kernel or systemd) reboots by itself.
# Needs dtparam=watchdog=on in config.txt (software/os/config.txt).
#
# Install:
#   sudo install -D -m 644 skjar-watchdog.conf /etc/systemd/system.conf.d/skjar-watchdog.conf
#   sudo systemctl daemon-reexec
#
# While the CM0 is hung or rebooting, the RP2040 sends the keys to the PC (if one is connected),
# because the CM0's kernel stops reading I2C (docs/protocol.md, 2.6).

[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
